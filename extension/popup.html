<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auto Bid</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { min-width: 320px; overflow-x: hidden; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { font-size: 15px; margin: 0; flex: 1; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; }
    .dot.on { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
    .dot.human { background: var(--warn); }
    /* minmax(0, 1fr): a long link can never make the panel wider */
    main { padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    main > * { min-width: 0; }
    .phase { font-weight: 600; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
    .card .t { font-weight: 600; }
    .modes { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .modes button { flex: 1; border: 0; border-radius: 0; background: var(--panel); }
    .modes button.active { background: var(--accent); color: #fff; }
    .modes button:disabled { opacity: .6; }
    .job { display: flex; align-items: center; gap: 8px; }
    .job .info { flex: 1; min-width: 0; }
    .job .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .jobs { display: grid; gap: 6px; }
    .counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .counts div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; text-align: center; }
    .counts b { display: block; font-size: 17px; }
    .counts span { font-size: 11px; color: var(--muted); }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 3; min-width: 0; }
    .actions #skipBtn { flex: 1; }
    #links textarea { width: 100%; min-height: 70px; box-sizing: border-box; font-size: 12px; }
    .lrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
    .lrow input { width: 52px; }
    #linkList { max-height: 150px; overflow: auto; font-size: 11.5px; margin-top: 6px; }
    #linkList div { display: flex; gap: 6px; border-bottom: 1px dashed var(--line); padding: 2px 0; min-width: 0; }
    #linkList .st { width: 64px; flex: none; font-weight: 600; }
    #linkList .u { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .st.applied { color: var(--accent-dark); } .st.attention { color: var(--warn); } .st.failed { color: #dc2626; }
    #log { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; height: max(210px, calc(100vh - 520px)); overflow: auto; padding: 6px 8px; font-size: 11.5px; line-height: 1.45; }
    #log div { border-bottom: 1px dashed var(--line); padding: 2px 0; overflow-wrap: anywhere; }
    #log time { color: var(--muted); margin-right: 5px; }
    footer { display: flex; justify-content: space-between; padding: 0 14px 12px; }
    footer a { color: var(--accent-dark); cursor: pointer; text-decoration: none; font-size: 12px; }
    #msg { min-height: 16px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Auto Bid</h1>
    <span class="phase" id="phase">Idle</span>
  </header>
  <main>
    <div id="signin" class="card warn hidden">Not signed in to Resume Builder. <a id="openOptions2" href="#">Open settings</a></div>
    <div class="modes" id="modes">
      <button data-mode="jobright">Jobright</button>
      <button data-mode="links">Job links</button>
    </div>

    <div class="card hidden" id="links">
      <textarea id="linkInput" placeholder="Paste job links here (one per line, or any text with links). Up to hundreds at once."></textarea>
      <div class="lrow">
        <button id="addLinks">Add links</button>
        <span id="linkCounts" class="muted"></span>
      </div>
      <div class="lrow">
        <button id="retryLinks" title="Put failed and stopped links back in the queue">Retry failed</button>
        <button id="clearDone" title="Remove finished links from the list">Clear finished</button>
        <button id="clearAll" title="Remove every link that is not running">Clear all</button>
      </div>
      <div id="linkList"></div>
    </div>

    <div class="jobs" id="jobs"></div>
    <div class="counts">
      <div><b id="cApplied">0</b><span>applied</span></div>
      <div><b id="cAttention">0</b><span>need you</span></div>
      <div><b id="cFailed">0</b><span>failed</span></div>
      <div><b id="cSkipped">0</b><span>skipped</span></div>
    </div>
    <div id="usage" class="muted" style="font-size:12px"></div>
    <div class="actions">
      <button id="skipBtn" title="Drop the job being applied to now and go to the next one" disabled>⏭ Skip</button>
      <button class="primary" id="startBtn">▶ Start bot</button>
      <button class="danger hidden" id="stopBtn">■ Stop</button>
      <button id="singleBtn" title="Apply to the Jobright job open in this tab">Apply to this job</button>
    </div>
    <div id="msg"></div>
    <div id="log"></div>
  </main>
  <footer>
    <a id="openOptions">⚙ Settings</a>
    <a id="openJobright">Open Jobright</a>
    <a id="clearLog">Clear log</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
