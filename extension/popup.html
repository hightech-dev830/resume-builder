<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auto Bid</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { min-width: 320px; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { font-size: 15px; margin: 0; flex: 1; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; }
    .dot.on { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
    .dot.human { background: var(--warn); }
    main { padding: 12px 14px; display: grid; gap: 10px; }
    .phase { font-weight: 600; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
    .card .t { font-weight: 600; }
    .counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .counts div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; text-align: center; }
    .counts b { display: block; font-size: 17px; }
    .counts span { font-size: 11px; color: var(--muted); }
    .counts div[data-status] { cursor: pointer; }
    .counts div[data-status]:hover { border-color: var(--accent); }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1; }
    #log { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; height: max(210px, calc(100vh - 340px)); overflow: auto; padding: 6px 8px; font-size: 11.5px; line-height: 1.45; }
    #log div { border-bottom: 1px dashed var(--line); padding: 2px 0; }
    #log time { color: var(--muted); margin-right: 5px; }
    footer { display: flex; justify-content: space-between; padding: 0 14px 12px; }
    footer a { color: var(--accent-dark); cursor: pointer; text-decoration: none; font-size: 12px; }
    .cur-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .cur-row .muted { flex: 1; }
    #skipBtn { padding: 3px 10px; font-size: 12px; }
    #msg { min-height: 16px; font-size: 12px; }
    #againBtn { width: 100%; border-color: var(--warn); color: var(--warn); font-weight: 600; }
    #againBtn:hover:not(:disabled) { background: color-mix(in srgb, var(--warn) 10%, var(--panel)); border-color: var(--warn); }
    #againBtn small { font-weight: 400; color: var(--muted); }
    .site-row { display: flex; align-items: center; gap: 8px; }
    .site-row label { margin: 0; white-space: nowrap; color: var(--text); font-weight: 600; font-size: 13px; }
    .site-row select { flex: 1; }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Auto Bid</h1>
    <span class="phase" id="phase">Idle</span>
  </header>
  <main>
    <div class="site-row" title="The job board the bot reads jobs from">
      <label for="site">Job site</label>
      <select id="site"></select>
    </div>
    <div id="signin" class="card warn hidden">Not signed in to Resume Builder. <a id="openOptions2" href="#">Open settings</a></div>
    <div class="card hidden" id="current">
      <div class="t" id="curTitle"></div>
      <div class="cur-row"><div class="muted" id="curMeta"></div><button id="skipBtn" title="Drop this job now and go to the next one">⏭ Skip job</button></div>
    </div>
    <div class="counts">
      <div data-status="applied" title="Open the history of applied jobs"><b id="cApplied">0</b><span>applied</span></div>
      <div data-status="attention" title="Open the history of jobs that need you"><b id="cAttention">0</b><span>need you</span></div>
      <div data-status="failed" title="Open the history of failed jobs"><b id="cFailed">0</b><span>failed</span></div>
      <div data-status="skipped" title="Open the history of skipped jobs"><b id="cSkipped">0</b><span>skipped</span></div>
    </div>
    <div id="usage" class="muted" style="font-size:12px"></div>
    <div class="actions">
      <button class="primary" id="startBtn">▶ Start bot</button>
      <button class="danger hidden" id="stopBtn">■ Stop</button>
      <button id="singleBtn" title="Apply to the Jobright job open in this tab">Apply to this job</button>
    </div>
    <button id="againBtn" class="hidden" title="After you fix a &quot;need you&quot; job (bot check, missing answer…), the bot carries on with it on its tab and submits it">↻ Apply again <small id="againInfo"></small></button>
    <div id="msg"></div>
    <div id="log"></div>
  </main>
  <footer>
    <a id="openOptions">⚙ Settings</a>
    <a id="openBoard">Open Jobright</a>
    <a id="openHistory">☰ History</a>
    <a id="clearLog">Clear log</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
